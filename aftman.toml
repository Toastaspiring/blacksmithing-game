# Toolchain pins (SPEC §1.4, §14.4). Run `aftman install` from the repo root; the shims resolve versions from
# the nearest aftman.toml, so always run rojo, lune and luau-lsp from here.
[tools]
rojo = "rojo-rbx/rojo@7.7.0"         # the installed Studio plugin is 7.7.0; an rc.1 server cannot talk to it
lune = "lune-org/lune@0.8.9"
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1"   # >= 1.67.0: named --definitions, sourcemap-aware string requires
